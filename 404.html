<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lost Your Way? · Ishant's Portfolio</title>
  <meta name="theme-color" content="#141414">
  <link rel="icon" type="image/svg+xml" href="assets/images/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #141414;
      color: #ffffff;
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: radial-gradient(circle at center, #222226 0%, #0d0d0d 100%);
    }
    .nf-404-brand {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: 48px;
      letter-spacing: 3px;
      color: #e50914;
      margin-bottom: 24px;
    }
    .nf-404-code {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: clamp(80px, 15vw, 140px);
      line-height: 0.9;
      color: rgba(255, 255, 255, 0.15);
      letter-spacing: 4px;
    }
    h1 {
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 700;
      margin: 12px 0 16px 0;
      letter-spacing: -0.5px;
    }
    p {
      color: #a0a0a0;
      font-size: 16px;
      line-height: 1.6;
      max-width: 480px;
      margin-bottom: 32px;
    }
    .nf-btn-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #e50914;
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 14px 32px;
      border-radius: 4px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(229, 9, 20, 0.4);
    }
    .nf-btn-home:hover {
      background: #ff1824;
      transform: translateY(-2px);
      box-shadow: 0 6px 26px rgba(229, 9, 20, 0.6);
    }
  </style>
</head>
<body>
  <div class="nf-404-brand">ISHANT</div>
  <div class="nf-404-code">404</div>
  <h1>Lost your way?</h1>
  <p>
    Sorry, we can't find that page on Ishant's portfolio. You'll find plenty to explore on the home page, including commercial reels, event highlights, and long-format films.
  </p>
  <a href="index.html" class="nf-btn-home">Ishant Home</a>
</body>
</html>
