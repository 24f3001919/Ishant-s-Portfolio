<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ishant – Video Editor &amp; 3D Motion Graphics Artist</title>
  <meta name="description" content="Portfolio of Ishant: Video Editor &amp; 3D Motion Graphics Artist. Featuring Netflix and Google inspired interactive browsing experiences.">

  <!-- Google Fonts: Bebas Neue, Inter, and Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="icon" type="image/svg+xml" href="assets/images/icons/favicon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/netflix.css">
  <link rel="stylesheet" href="css/google.css">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body>

  <!-- Top Theme Switcher Bar -->
  <header class="theme-switcher-bar">
    <div class="brand-label">
      <span>Ishant's Portfolio</span>
      <span class="brand-badge">2 Themes</span>
    </div>

    <div class="theme-switcher-group">
      <button class="theme-btn active" data-theme="netflix" title="Switch to Netflix Theme">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 2v20l8-8 8 8V2H4z"/>
        </svg>
        Netflix
      </button>
      <button class="theme-btn" data-theme="google" title="Switch to Google Theme">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14.93V18h-2v-1.07A7 7 0 0 1 5.07 11H6v-2h-.93A7 7 0 0 1 11 5.07V6h2v-.93A7 7 0 0 1 18.93 11H18v2h.93A7 7 0 0 1 13 16.93z"/>
        </svg>
        Google
      </button>
    </div>

    <div class="theme-action-pill">
      Press <kbd style="background:#222;padding:2px 6px;border-radius:4px;border:1px solid #444;font-size:11px;">Shift + T</kbd> to toggle
    </div>
  </header>

  <!-- Netflix View -->
  <div class="theme-view active" id="theme-netflix" role="region" aria-label="Netflix Themed Experience"></div>

  <!-- Google View -->
  <div class="theme-view" id="theme-google" role="region" aria-label="Google Themed Experience"></div>

  <!-- JavaScript Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
