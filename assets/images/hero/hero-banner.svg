      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="40%" stop-color="#1b1c24" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <radialGradient id="hglow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hglow2" cx="80%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#3a1c71" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
